name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: brew style and audit
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Style and audit
        env:
          # brew audit --online hits the GitHub API; unauthenticated runners hit the 60 req/h IP limit
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew style Casks/*.rb
          brew tap romanvassilchenko/tap "$PWD"
          # Homebrew loads third-party taps only once trusted; a tap from a local path is trusted after tapping
          brew trust romanvassilchenko/tap
          for cask in Casks/*.rb; do
            brew audit --cask --strict --online "romanvassilchenko/tap/$(basename "$cask" .rb)"
          done
